<!DOCTYPE html>
<html>
<head>
  <title>ESP8266 Stepper Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; background: #f2f2f2; padding: 40px; }
    button {
      font-size: 18px; margin: 10px; padding: 15px 25px;
      border: none; border-radius: 10px;
      background: #0078D7; color: white; cursor: pointer;
    }
    button:hover { background: #005FA3; }
    #log { text-align: left; margin-top: 20px; background: #fff; padding: 10px; border-radius: 10px; }
  </style>
</head>
<body>
  <h2>ESP8266 Stepper Motor HTTP Control</h2>

  <input type="number" id="turns" value="6" min="1" style="width:60px;"> turns<br>
  <input type="number" id="stops" value="12" min="1" style="width:60px;"> stops<br><br>

  <input type="number" id="rotateTurns" value="1" min="1" style="width:60px;"> rotate turns<br>

  <button onclick="sendStart()">Start</button>
  <button onclick="sendContinue()">Continue</button>
  <button onclick="sendStop()">Stop</button>
  <button onclick="pollStatus()">Poll Status</button>
  <button onclick="sendRotate()">Rotate</button>

  <div id="log"></div>

  <script>
    const logDiv = document.getElementById("log");
    function log(msg) {
      logDiv.innerHTML += msg + "<br>";
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    const baseUrl = "http://192.168.4.1";

    function sendStart() {
      const turns = document.getElementById("turns").value;
      const stops = document.getElementById("stops").value;
      fetch(`${baseUrl}/start?turns=${turns}&stops=${stops}`, { method: "POST" })
        .then(r => r.text())
        .then(txt => log(`➡️ Sent: START ${turns} ${stops}<br>Response: ${txt}`))
        .catch(e => log(`❌ Error: ${e}`));
    }

    function sendContinue() {
      fetch(`${baseUrl}/continue`, { method: "POST" })
        .then(r => r.text())
        .then(txt => log(`➡️ Sent: CONTINUE<br>Response: ${txt}`))
        .catch(e => log(`❌ Error: ${e}`));
    }

    function sendStop() {
      fetch(`${baseUrl}/stop`, { method: "POST" })
        .then(r => r.text())
        .then(txt => log(`➡️ Sent: STOP<br>Response: ${txt}`))
        .catch(e => log(`❌ Error: ${e}`));
    }

    function pollStatus() {
      fetch(`${baseUrl}/status`)
        .then(r => r.json())
        .then(json => log(`📊 Status: ${JSON.stringify(json)}`))
        .catch(e => log(`❌ Error: ${e}`));
    }

    function sendRotate() {
      const turns = document.getElementById("rotateTurns").value;
      fetch(`${baseUrl}/rotate?turns=${turns}`, { method: "POST" })
        .then(r => r.text())
        .then(txt => log(`➡️ Sent: ROTATE ${turns}<br>Response: ${txt}`))
        .catch(e => log(`❌ Error: ${e}`));
    }
  </script>
</body>
</html>
